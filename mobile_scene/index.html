<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>OfficeAI Scene</title>
    <style>
      html, body, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #10101c; }
      canvas { display: block; touch-action: none; }
    </style>
    <script>
      window.addEventListener("error", event => window.sceneError?.postMessage(event.message));
      window.addEventListener("unhandledrejection", event => window.sceneError?.postMessage(String(event.reason)));
    </script>
  </head>
  <body>
    <main id="scene" aria-label="OfficeAI 3D office"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
